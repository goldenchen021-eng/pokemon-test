<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿越宝可梦 · 你的初始宝可梦人格</title>
<meta name="description" content="15 道穿越难题，测出与你灵魂同频的那只宝可梦。结果可截图分享。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23FF4D6D'/%3E%3Cpath d='M4 50 a46 46 0 0 0 92 0 Z' fill='%23fff'/%3E%3Crect x='4' y='46' width='92' height='8' fill='%230B1830'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23fff' stroke='%230B1830' stroke-width='7'/%3E%3C/svg%3E">
<style>
/* ============ tokens ============ */
:root{
  --bg0:#071021; --bg1:#0B1830; --bg2:#10233F;
  --ink:#F6F9FF; --ink2:#C2CDEC; --ink3:#7E8DB6;
  --red:#FF4D6D; --red-deep:#E23352; --red-soft:rgba(255,77,109,.16);
  --blue:#38C7FF; --blue-soft:rgba(56,199,255,.16);
  --amber:#FFC83D; --amber-soft:rgba(255,200,61,.14);
  --line:rgba(255,255,255,.10);
  --card:rgba(255,255,255,.045);
  --grad-hot:linear-gradient(90deg,#FF4D6D,#FF9A5C 55%,#FFC83D);
  --grad-cool:linear-gradient(90deg,#38C7FF,#7B6CFF);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:url('assets/bg_cover2.png') center 24% / cover no-repeat fixed, var(--bg0);
  color:var(--ink); min-height:100vh;
  -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:var(--red);color:#fff}

/* ============ adventure background + readability overlay ============ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    linear-gradient(180deg, rgba(9,18,38,.36) 0%, rgba(9,18,38,.14) 38%, rgba(9,18,38,.24) 68%, rgba(9,18,38,.5) 100%),
    radial-gradient(120% 90% at 50% 0%, rgba(8,16,34,.20), transparent 55%);
}
.bg .deco{position:absolute;opacity:.5;animation:drift 6s ease-in-out infinite}
.bg .deco svg{display:block;width:100%;height:100%}
.bg .deco.d1{width:56px;height:56px;left:6%;top:14%;opacity:.42}
.bg .deco.d2{width:38px;height:38px;right:8%;top:34%;opacity:.36;animation-delay:1.1s}
.bg .deco.d3{width:46px;height:46px;left:12%;bottom:16%;opacity:.32;animation-delay:.6s}
.bg .deco.d4{width:30px;height:30px;right:10%;bottom:26%;opacity:.28;animation-delay:1.7s}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}

/* ============ 背景音乐开关 ============ */
.music-btn{position:fixed;right:14px;top:14px;z-index:99;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(170deg,#fcf2dc,#f2e1bc);border:1px solid #e3cfa5;
  box-shadow:0 6px 14px rgba(18,40,24,.30), inset 0 0 0 1px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s var(--ease), box-shadow .25s}
.music-btn:hover{transform:scale(1.08)}
.music-btn .ic{width:22px;height:22px;color:#8a5a2a;pointer-events:none}
.music-btn.playing{animation:musicPulse 1.6s ease-in-out infinite}
.music-btn.playing .ic{color:#e23352}
.music-btn.playing::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ffd 0%, #ffc83d 70%);right:4px;bottom:4px;
  box-shadow:0 0 6px rgba(255,200,61,.8)}
@keyframes musicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ============ app shell ============ */
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column;padding:22px 20px 34px}
.view.active{display:flex;animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 答题页：明亮像素海岛背景（图片1风格） */
#viewQuiz{position:relative;padding:18px 16px 34px}
#viewQuiz::before{content:"";position:fixed;inset:0;z-index:0;background:url('assets/bg_cover2.png') center / cover no-repeat, var(--bg0)}
#viewQuiz::after{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 30%,rgba(8,28,18,.16) 100%);pointer-events:none}
#viewQuiz > *{position:relative;z-index:1}
.letter{position:relative;background:linear-gradient(170deg,#fcf2dc,#f2e1bc);border:1px solid #e3cfa5;
  border-radius:16px;padding:20px 18px 16px;margin-bottom:18px;
  box-shadow:0 20px 40px rgba(18,40,24,.32), inset 0 0 0 1px rgba(255,255,255,.5);
  transform:rotate(-.4deg)}
.letter::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:repeating-linear-gradient(transparent,transparent 27px, rgba(168,104,58,.09) 28px)}
.l-tape{position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);width:94px;height:28px;z-index:3;
  background:rgba(214,190,140,.94);border-left:1px dashed rgba(120,95,55,.3);border-right:1px dashed rgba(120,95,55,.3);
  box-shadow:0 3px 6px rgba(90,60,25,.22)}
/* 背景散布的宝可梦点缀（像参考图里岛屿上的伙伴） */

/* ============ shared bits ============ */
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--ink2);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.03)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.btn-primary{
  width:100%;max-width:340px;border-radius:999px;padding:17px 22px;font-size:17px;font-weight:800;color:#fff;
  background:var(--grad-hot);letter-spacing:.02em;box-shadow:0 14px 34px rgba(255,77,109,.34);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{width:100%;max-width:340px;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;color:var(--ink2);
  border:1px solid var(--line);background:rgba(255,255,255,.03);transition:transform .18s var(--ease),border-color .18s}
.btn-ghost:active{transform:scale(.97)}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:60;background:rgba(11,24,48,.96);
  border:1px solid var(--line);color:var(--ink);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;
  pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ intro ============ */
#viewIntro{align-items:center;justify-content:center;text-align:center;padding-top:40px;padding-bottom:40px}
.brand-tag{margin-bottom:18px}
.cover-title{width:100%;max-width:430px;margin:2px auto 14px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.42))}
.cover-roster{position:relative;width:100%;max-width:430px;margin:2px auto 26px;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:10px}
.cover-roster::before{content:"";position:absolute;left:2%;right:2%;bottom:0;height:15px;border-radius:999px;background:linear-gradient(180deg,rgba(86,168,74,.62),rgba(32,96,46,.40));filter:blur(1px)}
.cover-roster::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:70%;height:30px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.30),transparent 70%);filter:blur(4px)}
.cover-roster img{position:relative;height:60px;width:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.30));animation:float 4s ease-in-out infinite}
.cover-roster img:nth-child(1){height:52px;margin-bottom:4px;animation-delay:.4s}
.cover-roster img:nth-child(2){height:56px;animation-delay:.9s}
.cover-roster img:nth-child(3){height:72px;animation-delay:.1s}
.cover-roster img:nth-child(4){height:58px;animation-delay:.7s}
.cover-roster img:nth-child(5){height:48px;margin-bottom:6px;animation-delay:1.2s}
.cover-roster img:nth-child(6){height:64px;animation-delay:.3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.kicker{font-size:12px;letter-spacing:.32em;color:#fff;margin-bottom:16px;font-weight:800;text-shadow:1px 1px 0 #16261a,-1px 1px 0 #16261a,1px -1px 0 #16261a,-1px -1px 0 #16261a,0 0 3px rgba(15,25,18,.5),0 1px 4px rgba(15,25,18,.55)}
h1{font-size:40px;line-height:1.18;font-weight:900;letter-spacing:.01em;margin-bottom:16px}
h1 .hl{background:var(--grad-hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:16px;color:#fff;max-width:300px;margin:0 auto 30px;text-shadow:1px 1px 0 #16261a,-1px 1px 0 #16261a,1px -1px 0 #16261a,-1px -1px 0 #16261a,0 0 4px rgba(15,25,18,.5),0 2px 5px rgba(15,25,18,.55);font-weight:800}
.meta{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#fff;margin-bottom:26px;text-shadow:1px 1px 0 #16261a,-1px 1px 0 #16261a,1px -1px 0 #16261a,-1px -1px 0 #16261a,0 0 3px rgba(15,25,18,.5),0 1px 4px rgba(15,25,18,.55);font-weight:800}
.meta b{color:var(--amber);font-weight:800}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--ink3);opacity:.5}
.note{margin-top:22px;font-size:12px;color:#fff;text-shadow:1px 1px 0 #16261a,-1px 1px 0 #16261a,1px -1px 0 #16261a,-1px -1px 0 #16261a,0 0 3px rgba(15,25,18,.5),0 1px 4px rgba(15,25,18,.55);font-weight:800}

/* ============ quiz ============ */
.quiz-top{display:flex;align-items:center;gap:14px;margin-bottom:20px;background:linear-gradient(180deg,#F7E9CB,#EAD5A8);border:1px solid rgba(150,110,60,.28);border-radius:18px;padding:12px 14px;box-shadow:0 8px 22px rgba(60,45,15,.14)}
.back{width:38px;height:38px;flex:none;border-radius:12px;border:1px solid rgba(40,60,90,.14);display:grid;place-items:center;background:#fff}
.back svg{width:18px;height:18px;stroke:#33405E}
.count{font-size:13px;color:#5A6B8C;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.progress{position:relative;flex:1;height:7px;border-radius:999px;background:rgba(40,60,90,.10);overflow:visible}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:var(--grad-hot);transition:width .45s var(--ease)}
.progress .pball{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:22px;height:22px;pointer-events:none}
.progress .pball svg{width:100%;height:100%;filter:drop-shadow(0 2px 5px rgba(0,0,0,.28))}
.q-axes{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.22em;color:#2f6b3f;font-weight:800;margin-bottom:12px}
.q-axes .qa-ball{width:15px;height:15px;flex:none;filter:drop-shadow(0 0 6px rgba(255,77,109,.5))}
.q-card{position:relative;padding:6px 4px 14px;margin-bottom:14px}
.q-num{position:absolute;top:20px;right:20px;font-size:13px;color:#8a6d3b;font-weight:800;letter-spacing:.04em}
.q-title{font-size:21px;line-height:1.42;font-weight:800;letter-spacing:.005em;padding-right:56px;margin-bottom:6px;color:#5a3a1a}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;border-radius:14px;
  border:2px dashed rgba(168,104,58,.45);background:rgba(255,252,242,.92);padding:15px 16px;font-size:15.5px;font-weight:700;color:#5a3a1a;
  transition:transform .15s var(--ease),border-color .15s,background .15s;min-height:58px;box-shadow:0 4px 12px rgba(90,60,25,.10);
}
.opt .idx{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#7a5230;background:#f3e2bd;transition:all .15s}
.opt:hover{border-color:rgba(168,104,58,.8);background:#fff8e8;transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:#e8574f;background:#fff0e6}
.opt.sel .idx{background:linear-gradient(135deg,#ff7a6e,#e8574f);color:#fff}
.opt .ck{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:all .2s var(--ease)}
.opt.sel .ck{opacity:1;transform:scale(1)}
.opt .ck svg{width:13px;height:13px;stroke:#fff}

/* ============ result ============ */
#viewResult{padding-top:18px}
.result-head{text-align:center;margin-bottom:16px}
.result-head .k{font-size:12px;letter-spacing:.28em;color:var(--ink3);font-weight:600}
.result-head h2{font-size:26px;font-weight:900;margin-top:8px}
/* 结算：米色纸张衬底 + 自然场景卡（图片2风格） */
.paper{
  position:relative;border-radius:22px;overflow:visible;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.55), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(214,188,142,.38), transparent 46%),
    #F4ECDD;
  padding:24px 18px 18px;
  box-shadow:0 30px 60px rgba(60,45,20,.28), inset 0 0 0 1px rgba(120,95,55,.16);
}
.paper::before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background-image:radial-gradient(rgba(120,95,55,.15) 1px, transparent 1px);background-size:14px 14px;opacity:.5}
.tape{position:absolute;z-index:3;width:94px;height:26px;background:rgba(176,130,66,.92);
  border-left:1px dashed rgba(120,95,55,.3);border-right:1px dashed rgba(120,95,55,.3);
  box-shadow:0 2px 5px rgba(0,0,0,.16)}
.tape.tl{top:-12px;left:16%;transform:rotate(-6deg)}
.tape.tr{top:-12px;right:16%;transform:rotate(5deg)}
.ribbon{position:absolute;z-index:3;top:30px;right:-9px;width:26px;height:150px;
  background:linear-gradient(180deg,#F9A8C8,#F472A0 45%,#E65E93);border-radius:8px;
  transform:rotate(9deg);box-shadow:0 4px 10px rgba(180,60,90,.25)}
.ribbon::after{content:"";position:absolute;left:-5px;right:-5px;bottom:-12px;height:20px;background:#F472A0;clip-path:polygon(0 0,100% 0,50% 100%)}
.scene-card{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 16px 34px rgba(40,30,10,.24)}
.scene-card .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-label{text-align:center;font-size:13px;color:#7A88A8;margin:0 0 2px;letter-spacing:.06em;font-weight:600}
.sc-name{text-align:center;font-size:38px;font-weight:900;letter-spacing:.01em;line-height:1.08;color:#22304B}
.sc-type-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.sc-code{display:inline-flex;align-items:center;border-radius:999px;padding:6px 14px;
  background:#EEF3FB;border:1px solid rgba(30,111,184,.18);font-size:14px;font-weight:800;letter-spacing:.16em;color:#1E6FB8}
.sc-role{font-size:16px;font-weight:800;background:var(--grad-cool);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.sc-orb{position:relative;z-index:2;width:218px;height:218px;margin:16px auto 2px}
.sc-orb .ground{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:86%;height:18px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(30,60,30,.42),transparent 70%);filter:blur(2px)}
.sc-orb img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 26px rgba(20,40,20,.40));animation:float 5s ease-in-out infinite}
.petal{position:absolute;z-index:2;width:10px;height:10px;border-radius:50% 0 50% 50%;background:linear-gradient(135deg,#FFD3E0,#F9A8C8);opacity:.85;transform:rotate(45deg);animation:petalFall 7s ease-in-out infinite}
.petal.p1{top:12%;left:18%}
.petal.p2{top:20%;right:22%;width:8px;height:8px;animation-delay:2.2s}
.petal.p3{top:34%;left:28%;width:9px;height:9px;opacity:.7;animation-delay:4.1s}
@keyframes petalFall{0%,100%{transform:translateY(0) rotate(45deg);opacity:.85}50%{transform:translateY(16px) rotate(68deg);opacity:.55}}
.scene-info{position:relative;z-index:2;background:rgba(255,255,255,.94);padding:16px 16px 12px;border-top:1px solid rgba(120,95,55,.14)}
.sc-div{height:1px;background:rgba(40,60,90,.10);margin:18px 2px 14px}
.sc-sub{font-size:12px;letter-spacing:.2em;color:#5A6B8C;font-weight:800;margin-bottom:12px;text-align:center}
.radar-wrap{display:flex;justify-content:center;margin:2px auto 4px}
.radar-wrap svg{width:242px;height:242px;display:block}
.radar-wrap .rl{fill:#7A88A8;font-size:12px;font-weight:800;text-anchor:middle}
.radar-wrap .rv{fill:#22304B;font-size:10px;font-weight:700;text-anchor:middle}
.radar-wrap .rr{fill:none;stroke:rgba(40,60,90,.12);stroke-width:1}
.radar-wrap .rd{fill:none;stroke:rgba(40,60,90,.10);stroke-width:1}
.radar-wrap .rgrid{fill:none;stroke:rgba(40,60,90,.16);stroke-width:1.4}
.radar-wrap .rpoly{fill:url(#rgrad);fill-opacity:.5;stroke:var(--red);stroke-width:2.4;stroke-linejoin:round}
.radar-wrap .rdot{fill:var(--amber)}
.radar-wrap .rsum{fill:#5A6B8C;font-size:9px;font-weight:600;text-anchor:middle}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{font-size:12.5px;font-weight:700;color:#33405E;border:1px solid rgba(40,60,90,.14);border-radius:999px;padding:7px 13px;background:#F2F6FC}
.oak-block{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;margin-top:4px}
.oak-portrait{position:relative;width:118px;height:150px;margin:0 auto;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#12304F,#0C2038);border:1px solid rgba(40,60,90,.2);flex:none;animation:oakBob 3.4s ease-in-out infinite,oakGlow 3.4s ease-in-out infinite}
.oak-portrait::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:linear-gradient(transparent,rgba(255,200,61,.18));pointer-events:none}
.oak-portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));animation:oakBreath 3.4s ease-in-out infinite;transform-origin:center bottom}
@keyframes oakBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes oakBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes oakGlow{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 14px 28px rgba(0,0,0,.42),0 0 24px rgba(255,200,61,.42)}}
.oak-text{min-width:0}
.oak-name{font-size:13px;font-weight:800;color:#D98A2B;letter-spacing:.1em;margin-bottom:6px}
.oak-intro{font-size:13.5px;line-height:1.65;color:#33405E;margin-bottom:8px}
.oak-cheer{font-size:13.5px;line-height:1.65;color:#22304B;font-weight:700;padding-left:12px;border-left:3px solid var(--red);border-radius:2px}
.sc-foot{text-align:center;font-size:11.5px;color:#8A97B5;margin-top:18px;letter-spacing:.04em;border-top:1px dashed rgba(40,60,90,.14);padding-top:14px}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:22px}
.actions .row{display:flex;gap:12px;width:100%;max-width:340px}
.actions .btn-ghost,.actions .btn-primary{max-width:none}

/* ============ result · 手账卡片（蛋仔派对圆润可爱风） ============ */
#viewResult{position:relative;padding:14px 16px 46px}
.journal{
  position:relative;border-radius:18px;padding:12px 12px 10px;overflow:hidden;
  background:#fdf6e5;
  border:10px solid #fdf6e5;outline:2px solid #e3cfa5;
  transform:rotate(-.5deg);
  box-shadow:0 14px 34px rgba(90,60,20,.32),0 4px 8px rgba(90,60,20,.18);
}
.journal::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(120,95,55,.12) 1px,transparent 1px);background-size:15px 15px;opacity:.4}
.deco{position:absolute;z-index:22;pointer-events:none}
.deco.tl{top:-20px;left:-14px;width:96px;height:40px;background:rgba(214,190,140,.9);transform:rotate(-35deg);
  box-shadow:0 2px 6px rgba(120,95,55,.3);border-left:1px dashed rgba(120,95,55,.25);border-right:1px dashed rgba(120,95,55,.25)}
.deco.tr{top:-16px;right:4px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFD3A6,#FF9E3D);box-shadow:0 4px 8px rgba(180,110,40,.45)}
.deco.tr::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.75)}
.deco.br{bottom:-14px;left:30%;width:110px;height:30px;background:rgba(214,190,140,.9);transform:rotate(4deg);
  box-shadow:0 2px 6px rgba(120,95,55,.3);border-left:1px dashed rgba(120,95,55,.25);border-right:1px dashed rgba(120,95,55,.25)}
.j-kick{position:relative;text-align:center;font-size:12px;letter-spacing:.3em;color:#8A6D3B;font-weight:800;margin:2px 0 12px}
.j-hero{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end;min-height:270px;margin-bottom:6px}
.j-water{position:absolute;left:-8%;right:-8%;bottom:-6px;height:86px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%, rgba(120,200,220,.5), rgba(120,200,220,0) 72%)}
.j-water::after{content:"";position:absolute;left:8%;right:8%;bottom:8px;height:22px;border-radius:50%;
  background:repeating-radial-gradient(ellipse at 50% 100%, transparent 0 10px, rgba(80,160,190,.26) 11px 13px)}
.j-vtag-wrap{position:absolute;left:3px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center}
.j-ball{width:34px;height:34px;margin-bottom:-2px;filter:drop-shadow(0 3px 6px rgba(90,50,20,.25))}
.j-vtag{
  writing-mode:vertical-rl;letter-spacing:.12em;font-weight:900;font-size:18px;color:#5a3a1a;
  background:#f3e6c8;border:2px solid #8a5a33;border-radius:6px 14px 6px 14px;padding:12px 7px;
  box-shadow:0 6px 14px rgba(90,50,20,.18)}
.j-drop{width:20px;height:20px;margin-top:4px;filter:drop-shadow(0 2px 4px rgba(43,108,163,.3))}
.j-poke{position:relative;z-index:2;width:230px;height:230px;object-fit:contain;
  filter:drop-shadow(0 20px 26px rgba(30,40,20,.30));animation:float 4.6s ease-in-out infinite}
.j-pill{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:-14px auto 16px;z-index:5;
  width:max-content;max-width:90%;background:#fdf3dd;border:2px dashed #a8683a;border-radius:999px;padding:8px 18px;
  box-shadow:0 6px 14px rgba(90,50,20,.14)}
.j-pill svg{width:20px;height:20px;flex:none}
.j-pill span{color:#8a4a1a;font-weight:800;font-size:16px;letter-spacing:.02em}
.j-bars{position:relative;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.jb{position:relative;background:rgba(253,246,229,.95);border:2px solid #e3cfa5;border-radius:16px;padding:9px 12px 22px;box-shadow:0 5px 14px rgba(90,60,20,.08)}
.jb-row{display:flex;align-items:center;gap:9px}
.jb-ic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.jb-ic svg{width:22px;height:22px}
.jb-name{font-size:14.5px;font-weight:800;color:#5a3a1a}
.jb-right{margin-left:auto;display:flex;align-items:center;gap:5px}
.jb-stars{display:flex;gap:1px}
.jb-stars svg{width:17px;height:17px}
.jb-pct{font-size:12px;font-weight:800;color:#9a7a4a}
.jb-track{position:absolute;left:12px;right:12px;bottom:8px;height:9px;border-radius:999px;background:rgba(0,0,0,.12);overflow:hidden}
.jb-fill{display:block;height:100%;border-radius:999px}
.j-note{position:relative;background:#fff9e8;border:2px dashed #d8b06a;border-radius:16px;padding:14px 16px 42px;
  transform:rotate(-.5deg);box-shadow:0 8px 18px rgba(70,50,20,.10)}
.j-note-foot{position:absolute;left:16px;right:16px;bottom:10px;display:flex;align-items:center;gap:6px;font-size:12px;color:#9a7a4a}
.j-note-foot svg{width:16px;height:16px;flex:none}
.j-note-foot b{color:#c0554a;font-weight:800}
.j-note-foot .guardian{margin-left:auto;font-weight:800;color:#c0554a;white-space:nowrap}
.j-pin{position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFD3A6,#FF9E3D);box-shadow:0 3px 6px rgba(180,110,40,.4);z-index:2}
.j-note-t{font-size:13px;font-weight:900;color:#C98A2B;letter-spacing:.08em;margin-bottom:8px;text-align:center}
.j-note p{font-size:14px;line-height:1.7;color:#5A4A2A;margin:0 0 6px}
.j-note .j-cheer{font-weight:800;color:#33405E}
.j-foot{position:relative;text-align:center;font-size:11.5px;color:#9A8A6A;margin-top:16px;letter-spacing:.05em;font-weight:600}
.mini-again{position:fixed;right:18px;bottom:22px;z-index:40;border:none;cursor:pointer;opacity:.88;
  display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FF7A6E,#FF4D6D);color:#fff;
  font-size:13px;font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(255,77,109,.4)}
.mini-again:active{transform:scale(.96)}

/* ============ desktop ============ */
@media (min-width:768px){

}
@media (prefers-reduced-motion:reduce){

}

<script>
'use strict';
/* ================= 题库池：5 维各 6 题场景化，每次抽 3 + 洗牌 ================= */
let QUESTIONS = [];
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQuestions(){
  const picked = [];
  Object.keys(QUESTION_POOL).forEach(axis=>{
    shuffle(QUESTION_POOL[axis]).slice(0,3).forEach(q=>{
      picked.push({axis, q:q.q, opts:shuffle(q.opts)});
    });
  });
  QUESTIONS = shuffle(picked);
  answers = [];
}
const QUESTION_POOL = {
  EI:[
    {q:'你被传送到了一个人声鼎沸的宝可梦集市，摊位林立、热闹非凡。你的第一反应是——', opts:[
      {t:'挨个摊位搭话，跟摊主聊个不停', p:'E'},
      {t:'先绕一圈，看清楚再决定跟谁说话', p:'I'},
      {t:'马上凑进旁边一群人的讨论里', p:'E'},
      {t:'找个安静角落先待着，缓缓神', p:'I'}]},
    {q:'博士的助手带你参观研究所，迎面走来一群研究员。你会——', opts:[
      {t:'主动自我介绍，把名字先报上', p:'E'},
      {t:'微笑点头，等别人先开口', p:'I'},
      {t:'拉上助手一起加入他们的聊天', p:'E'},
      {t:'安静跟在后面听他们讲', p:'I'}]},
    {q:'森林里遇到一支正扎营的探险队，篝火已经点起来了。你——', opts:[
      {t:'走上去帮忙搭把手，很快就混熟了', p:'E'},
      {t:'先在远处观察一会儿，再慢慢靠近', p:'I'},
      {t:'主动问他们从哪来、要去哪', p:'E'},
      {t:'点头示意后，自己找地方坐下', p:'I'}]},
    {q:'你的宝可梦在道馆赛输了，队友围过来七嘴八舌安慰你。你——', opts:[
      {t:'越说越来劲，跟大家把这场复盘聊开', p:'E'},
      {t:'想一个人待会儿，静静消化', p:'I'},
      {t:'把情绪讲给每一个人听', p:'E'},
      {t:'道声谢就自己回房间待着', p:'I'}]},
    {q:'出发前，博士问你要不要和其他训练家结伴上路。你——', opts:[
      {t:'当然要，路上有人一起才有趣', p:'E'},
      {t:'还是算了，一个人走得自在', p:'I'},
      {t:'立刻约好明天的集合时间', p:'E'},
      {t:'说看情况，其实更想独自走', p:'I'}]},
    {q:'镇上办宝可梦嘉年华，音乐、气球、人群挤满广场。你——', opts:[
      {t:'一头扎进去玩到天黑', p:'E'},
      {t:'远远看着也挺好，不挤进去', p:'I'},
      {t:'拉着同伴一起疯玩', p:'E'},
      {t:'坐在外围喝着饮料看热闹', p:'I'}]}
  ],
  SN:[
    {q:'博士递给你一张藏宝图，上面画着弯弯绕绕的路线。你先看的是——', opts:[
      {t:'图上标得清清楚楚的地点和距离', p:'S'},
      {t:'终点究竟藏着什么宝物和传说', p:'N'},
      {t:'每一段路的方向和地标', p:'S'},
      {t:'这条路通向哪个未知的传说', p:'N'}]},
    {q:'路过一片发着光的奇怪草丛。你——', opts:[
      {t:'直接走进去，看看里面到底有什么', p:'S'},
      {t:'忍不住想这背后是什么神秘力量', p:'N'},
      {t:'留意草丛里真实的声音和动静', p:'S'},
      {t:'想象它通向一个怎样的奇幻世界', p:'N'}]},
    {q:'训练新宝可梦时，最让你兴奋的是——', opts:[
      {t:'它真的把那个招式练成的那一刻', p:'S'},
      {t:'想象它将来会进化成什么样', p:'N'},
      {t:'看着它的等级和属性实打实上涨', p:'S'},
      {t:'憧憬它和你并肩的种种可能', p:'N'}]},
    {q:'在一座古塔里发现刻满图案的石壁。你——', opts:[
      {t:'仔细辨认每一道刻痕和符号', p:'S'},
      {t:'琢磨这些图案想讲一个什么故事', p:'N'},
      {t:'把石壁上的细节都记下来', p:'S'},
      {t:'联想这座塔背后的古老秘密', p:'N'}]},
    {q:'这趟冒险里，最让你着迷的是——', opts:[
      {t:'亲眼看到的风景、遇到的宝可梦', p:'S'},
      {t:'永远猜不到的下一站会是什么', p:'N'},
      {t:'实打实的打斗、收集和成长过程', p:'S'},
      {t:'关于未来的那些想象和计划', p:'N'}]},
    {q:'摊开一张世界地图，你的目光会先落在——', opts:[

/* ================= 计分 ================= */
function compute(){
  const axes = ['EI','SN','TF','JP','CS'];
  const votes = {EI:{E:0,I:0},SN:{S:0,N:0},TF:{T:0,F:0},JP:{J:0,P:0},CS:{C:0,S:0}};
  answers.forEach((pole,i)=>{ votes[QUESTIONS[i].axis][pole]++; });
  const detail = axes.map(a=>{
    const [p1,p2] = a.split('');
    const v1 = votes[a][p1], v2 = votes[a][p2];
    return {a, p1, p2, v1, v2, win: v1>=v2?p1:p2};
  });
  const mbti = detail.slice(0,4).map(d=>d.win).join('');
  const code = mbti + '-' + detail[4].win;
  return {code, type: TYPES[code], detail};
}

/* ================= 雷达图（屏幕 SVG 与分享 Canvas 共用坐标） ================= */
function radarData(detail){
  // 返回每轴：值(0-100)、胜出字母
  return detail.map(d=>{
    const pct = Math.round(Math.max(d.v1,d.v2)/3*100);
    return {v:pct, lab:d.win, axis:d.a};
  });
}
function radarPoint(i, n, cx, cy, R, ratio){
  const a = (-90 + i*(360/n)) * Math.PI/180;
  return [cx + R*ratio*Math.cos(a), cy + R*ratio*Math.sin(a)];
}
function radarSVG(detail){
  const n = detail.length;
  const W = 250, H = 250, cx = 125, cy = 125, R = 80;
  const data = radarData(detail);
  const poly = arr => arr.map(p=>p.map(v=>Math.round(v)).join(',')).join(' ');
  let s = '';
  [25,50,75,100].forEach(r=>{
    const ring = [];
    for(let i=0;i<n;i++){ ring.push(radarPoint(i,n,cx,cy,R,r/100)); }
    s += `<polygon class="rr" points="${poly(ring)}"/>`;
  });
  for(let i=0;i<n;i++){
    const p = radarPoint(i,n,cx,cy,R,1);
    s += `<line class="rd" x1="${cx}" y1="${cy}" x2="${Math.round(p[0])}" y2="${Math.round(p[1])}"/>`;
  }
  const dp = data.map((d,i)=>radarPoint(i,n,cx,cy,R,d.v/100));
  s += `<polygon class="rpoly" points="${poly(dp)}"/>`;
  data.forEach((d,i)=>{
    const p = radarPoint(i,n,cx,cy,R,d.v/100);
    s += `<circle class="rdot" cx="${Math.round(p[0])}" cy="${Math.round(p[1])}" r="3.4"/>`;
  });
  data.forEach((d,i)=>{
    const p = radarPoint(i,n,cx,cy,R,(R+18)/R);
    const pv = radarPoint(i,n,cx,cy,R,(R+36)/R);
    s += `<text class="rl" x="${Math.round(p[0])}" y="${Math.round(p[1]+4)}">${d.lab}</text>`;
    s += `<text class="rv" x="${Math.round(pv[0])}" y="${Math.round(pv[1]+3)}">${d.v}%</text>`;
  });
  const sum = Math.round(data.reduce((a,b)=>a+b.v,0)/n);
  s += `<text class="rsum" x="${cx}" y="${cy+4}">综合 ${sum}%</text>`;
  const defs = `<defs><linearGradient id="rgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4D6D"/><stop offset="1" stop-color="#FFC83D"/></linearGradient></defs>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="人格五维雷达图">${defs}${s}</svg>`;
}

function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动长按选择文案'); }
  document.body.removeChild(ta);
}

/* 把图片读成 dataURL，避免 canvas 被污染（file:// 下不可用则走截图提示） */
function loadAsDataURL(src){
  return fetch(src).then(r=>r.blob()).then(b=>new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(b);
  }));
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawRadarCanvas(ctx, cx, cy, R, data){
  const n = data.length;
  const pt = (i,ratio)=>{
    const a = (-90 + i*(360/n))*Math.PI/180;
    return [cx + R*ratio*Math.cos(a), cy + R*ratio*Math.sin(a)];
  };
  // rings
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.12)';
  [0.25,0.5,0.75,1].forEach(r=>{
    ctx.beginPath();
    for(let i=0;i<=n;i++){ const [x,y]=pt(i%n,r); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath(); ctx.stroke();
  });
  // spokes
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.08)';
  for(let i=0;i<n;i++){ const [x,y]=pt(i,1); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke(); }
  // data polygon
  ctx.beginPath();
  for(let i=0;i<n;i++){ const [x,y]=pt(i,data[i].v/100); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
  const grad = ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  grad.addColorStop(0,'rgba(255,77,109,.55)'); grad.addColorStop(1,'rgba(255,200,61,.55)');
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#FF4D6D'; ctx.stroke();
  // dots + labels
  ctx.textAlign = 'center';
  data.forEach((d,i)=>{
    const [x,y]=pt(i,d.v/100);
    ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fillStyle='#FFC83D'; ctx.fill();
    const [lx,ly]=pt(i,1.22);
    ctx.fillStyle='#7E8DB6'; ctx.font='800 34px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(d.lab, lx, ly+12);
    const [vx,vy]=pt(i,1.44);
    ctx.fillStyle='#F6F9FF'; ctx.font='700 28px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(d.v+'%', vx, vy+10);
  });
}

      ctx.fillText(CHIP[d.a][d.win], bx+70, y+12);
      let sx=W-bx-250, sy=y+10, sr=26;
      for(let s=0;s<5;s++){star(sx,sy,sr,Math.max(0,Math.min(1,pct/20-s)));sx+=54;}
      ctx.fillStyle='#9A8A6A';ctx.font='700 32px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='right';
      ctx.fillText('('+pct+'%)', W-bx, sy+12);
      ctx.fillStyle='#F1E7D4';rr(bx,y+38,bw,28,14);ctx.fill();
      const fillW=Math.max(14,bw*pct/100);
      ctx.save();rr(bx,y+38,fillW,28,14);ctx.clip();ctx.fillStyle=icC;ctx.fillRect(bx,y+38,fillW,28);ctx.restore();
    });
    // 博士便签
    const nw=W-260,nx=130,ny=1660,nh=250;
    ctx.save();ctx.translate(nx+nw/2,ny);ctx.rotate(-0.008);
    ctx.fillStyle='#FFF9E8';rr(-nw/2,0,nw,nh,36);ctx.fill();
    ctx.strokeStyle='#D8B06A';ctx.lineWidth=4;ctx.setLineDash([14,12]);rr(-nw/2,0,nw,nh,36);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#FF9E3D';ctx.beginPath();ctx.arc(0,-16,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(-7,-20,6,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.textAlign='center';ctx.fillStyle='#C98A2B';ctx.font='900 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('大木博士的图鉴笔记', W/2, ny+48);
    ctx.fillStyle='#5A4A2A';ctx.font='500 30px "PingFang SC","Microsoft YaHei",sans-serif';
    let ty=ny+108;
    wrapTxt(dr.oak,nw-80).slice(0,2).forEach(ln=>{ctx.fillText(ln,W/2,ty);ty+=46;});
    ctx.fillStyle='#33405E';ctx.font='700 30px "PingFang SC","Microsoft YaHei",sans-serif';
    wrapTxt(dr.cheer,nw-80).slice(0,1).forEach(ln=>{ctx.fillText(ln,W/2,ty);ty+=46;});
    // 训练家脚注 + 底部提示
    ctx.fillStyle='#9A8A6A';ctx.font='600 28px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('训练家：@你的名字   生成我的专属守护者', W/2, ny+nh+44);
    ctx.fillText('分享到 朋友圈 / 小红书 / 抖音', W/2, H-26);
    // export
    const url=cv.toDataURL('image/png');
    const a=document.createElement('a');a.href=url;a.download='我的初始宝可梦_'+code+'.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    toast('分享卡已生成');
  }
}

/* ================= 背景音乐 ================= */
window.addEventListener('load', ()=>{
  const bgm = $('#bgm'); const btn = $('#btnMusic'); const s = $('#sClick');
  if(!bgm || !btn) return;
  if(s){ s.volume = 0.35; }   // 点击音效音量调小
  bgm.volume = 0.5;            // 背景音乐音量调小
  let on = false;
  function startMusic(){
    if(on) return;
    const p = bgm.play();
    if(p && p.then){
      p.then(()=>{ on=true; btn.classList.add('playing'); btn.setAttribute('aria-pressed','true'); btn.title='关闭背景音乐'; }).catch(()=>{});
    } else {
      on=true; btn.classList.add('playing'); btn.setAttribute('aria-pressed','true'); btn.title='关闭背景音乐';
    }
  }
  function stopMusic(){
    bgm.pause(); on=false; btn.classList.remove('playing'); btn.setAttribute('aria-pressed','false'); btn.title='开启背景音乐';
  }
  btn.addEventListener('click', ()=>{ if(!on){ startMusic(); } else { stopMusic(); } });
  // 尽量自动播放：load 先尝试；被浏览器拦截时，等用户首次点击页面任意处自动响起
  startMusic();
  const firstTouch = (ev)=>{
    document.removeEventListener('click', firstTouch, true);
    document.removeEventListener('touchstart', firstTouch, true);
    if(on) return;
    if(ev.target && ev.target.closest && ev.target.closest('#btnMusic')) return;
    startMusic();
  };
  document.addEventListener('click', firstTouch, true);
  document.addEventListener('touchstart', firstTouch, true);
});

</script>
<audio id="bgm" src="assets/bgm.wav" loop preload="auto"></audio>
<audio id="sClick" src="assets/click.wav" preload="auto"></audio>
<button id="btnMusic" class="music-btn" aria-label="背景音乐" aria-pressed="false" title="开启背景音乐">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
  </svg>
</button>
